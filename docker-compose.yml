services:
  mysql:
    image: mysql:8.0
    container_name: contact-mysql
    restart: always
    environment:
      MYSQL_DATABASE: contactdb
      MYSQL_USER: contactuser
      MYSQL_PASSWORD: contactpass
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: contact-app
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/contactdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: contactuser
      SPRING_DATASOURCE_PASSWORD: contactpass
    ports:
      - "8080:8080"

volumes:
  mysql_data:
